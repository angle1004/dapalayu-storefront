    async function doLogin() {
      const email = val('f_lemail').trim().toLowerCase(), pw = val('f_lpw');
      setErr('e_lemail', ''); setErr('e_lpw', '');
      let ok = true;
      if (!isEmail(email)) { setErr('e_lemail', t('eEmailFormat')); ok = false; }
      if (!pw) { setErr('e_lpw', t('ePwRequired')); ok = false; }
      if (!ok) {
        const firstInvalid = $auth.querySelector('.inp.bad, input[type="checkbox"]:not(:checked)');
        firstInvalid?.focus(); firstInvalid?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }

      if (authBusy) return;                       // 중복 제출 차단
      authBusy = true;
      const btn = $auth.querySelector('[data-act="login"]');
      setBusy(btn, true, t('waitLogin')); waitShow('waitLogin');
      try {
        const result = await apiRequest('/api/auth/login', { method: 'POST', body: JSON.stringify({ email, password: pw }) });
        saveApiSession(result.token, result.user);
        const orders = await apiRequest('/api/orders'); apiOrders = (orders.orders || []).map(normalizeApiOrder);
        waitHide(); closeOverlays(); syncHeader(); toast(t('tWelcome', { name: result.user.name }));
        if (location.hash.startsWith('#/account')) route();
      } catch (error) {
        setErr('e_lpw', error.message || t('eLoginFail'));
      } finally {
        authBusy = false; waitHide(); setBusy(btn, false);
      }
    }

    async function doSignup() {
      const name = val('f_name').trim(), email = val('f_email').trim().toLowerCase();
      const phone = normalizeVietnamPhone(val('f_phone').trim()), pw = val('f_pw'), pw2 = val('f_pw2');
      ['e_name', 'e_email', 'e_phone', 'e_pw', 'e_pw2'].forEach(k => setErr(k, ''));
      document.getElementById('e_terms').textContent = '';

      let ok = true;
      if (name.length < 2) { setErr('e_name', t('eNameMin')); ok = false; }
      if (!isEmail(email)) { setErr('e_email', t('eEmailFormat')); ok = false; }
      if (!isPhone(phone)) { setErr('e_phone', t('ePhFormat')); ok = false; }
      if (!isPw(pw)) { setErr('e_pw', t('ePwWeak')); ok = false; }
      if (pw !== pw2) { setErr('e_pw2', t('ePwMismatch')); ok = false; }
      if (!chk('f_t1') || !chk('f_t2')) { document.getElementById('e_terms').textContent = t('eTerms'); ok = false; }
      if (!ok) {
        const firstInvalid = $auth.querySelector('.inp.bad, input[type="checkbox"]:not(:checked)');
        firstInvalid?.focus(); firstInvalid?.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }

      if (authBusy) return;
      authBusy = true;
      const btn = $auth.querySelector('[data-act="signup"]');
      setBusy(btn, true, t('waitSignup')); waitShow('waitSignup');
      try {
        const result = await apiRequest('/api/auth/signup', { method: 'POST', body: JSON.stringify({ name, email, phone: '+84' + phone.slice(1), password: pw }) });
        saveApiSession(result.token, result.user);
        waitHide(); closeOverlays(); syncHeader();
        toast(t('tSignedUp', { name: result.user.name })); go('#/account/profile');
      } catch (error) {
        const message = error.message || t('eEmailDup');
        setErr('e_email', message); toast(message);
        document.getElementById('e_email')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } finally {
        authBusy = false; waitHide(); setBusy(btn, false);
      }
    }

    async function saveAddr(u, id) {
      const f = {
        label: val('f_alabel').trim() || t('adLabelPh').split('/')[0].trim(),
        recipient: val('f_arecip').trim(),
        phone: val('f_aphone').trim(),
        street: val('f_astreet').trim(),
        ward: val('f_award').trim(),
        district: val('f_adistrict').trim(),
        province: val('f_aprovince').trim(),
      };
      ['e_arecip', 'e_aphone', 'e_astreet', 'e_award', 'e_adistrict', 'e_aprovince'].forEach(k => setErr(k, ''));
      let ok = true;
      if (f.recipient.length < 2) { setErr('e_arecip', t('eNameMin')); ok = false; }
      if (!isPhone(f.phone)) { setErr('e_aphone', t('ePhFormat')); ok = false; }
      if (f.street.length < 4) { setErr('e_astreet', t('eStreet')); ok = false; }
      if (!f.ward) { setErr('e_award', t('eWard')); ok = false; }
      if (!f.district) { setErr('e_adistrict', t('eDistrict')); ok = false; }
      if (!f.province) { setErr('e_aprovince', t('eProvince')); ok = false; }
      if (!ok) return;

      let list = addrOf(u.id);
      const wantDef = chk('f_adef') || !list.length;

      if (id) { list = list.map(a => a.id === id ? { ...a, ...f } : a); }
      else { const nid = uid(); list = [...list, { id: nid, ...f, def: false }]; id = nid; }
      if (wantDef) list = list.map(a => ({ ...a, def: a.id === id }));
      if (!list.some(a => a.def)) list[0].def = true;

      if (apiUser) {
        try { const result = await apiRequest('/api/me', { method: 'PATCH', body: JSON.stringify({ addresses: list }) }); apiUser = normalizeApiUser(result.user); }
        catch (error) { toast(error.message); return; }
      } else addrSet(u.id, list);
      addrEdit = null;
      renderAccount('addresses');
      toast(t('tAddrSaved'));
    }

      const list = addrOf(u.id).filter(a => a.id !== id);

    function orderNo() {
      const d = new Date();
      return `DP-${String(d.getFullYear()).slice(2)}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${Math.floor(Math.random() * 9000) + 1000}`;

    async function checkout() {
      if (!cart.length) return;
      const u = currentUser();
      if (!u) { closeOverlays(); openAuth('login'); toast(t('tLoginRequired')); return; }

      const list = addrOf(u.id);
      if (!list.length) { closeOverlays(); go('#/account/addresses'); toast(t('tAddrRequired')); return; }

      const a = list.find(x => x.def) || list[0];
      const { sub, ship, total } = cartTotals();
      const order = {
        no: orderNo(), at: Date.now(), status: 'paid',
        items: cart.map(c => ({ id: c.id, oi: c.oi, qty: c.qty, price: findP(c.id).p })),
        sub, ship, total,
        to: { recipient: a.recipient, phone: a.phone, street: a.street, ward: a.ward, district: a.district, province: a.province },
      };
      if (apiUser) {
        try {
          const result = await apiRequest('/api/orders', {
            method: 'POST', body: JSON.stringify({
              items: cart.map(c => { const p = findP(c.id); return { productId: p.id, name: pName(p), option: pOpts(p)[c.oi], quantity: c.qty, unitPrice: p.p }; }),
              subtotal: sub, shippingFee: ship, total, shippingAddress: a
            })
          });
          apiOrders = [normalizeApiOrder(result.order), ...apiOrders];
        } catch (error) { toast(error.message); return; }
      } else {
        const all = store.get(K_ORDERS, {}); all[u.id] = [order, ...(all[u.id] || [])]; store.set(K_ORDERS, all);
      }

      cart = []; saveCart(); renderCart(); closeOverlays();
      go('#/account/orders');
      toast(t('tOrdered', { amt: money(total) }));
    }

    async function loadAdminFromApi() {
      if (!apiUser || apiUser.role !== 'admin') return;
      try {
        const [ordersRes, usersRes, threadsRes] = await Promise.all([apiRequest('/api/orders'), apiRequest('/api/admin/users'), apiRequest('/api/chat/threads')]);
        const list = (ordersRes.orders || []).map(normalizeApiOrder), members = (usersRes.users || []).map(u => ({ ...u, id: u._id, at: new Date(u.createdAt).getTime() }));
        const grouped = {}; list.forEach(o => { const raw = (ordersRes.orders || []).find(x => x.orderNo === o.no); const uid = raw?.user?._id || raw?.user || 'unknown'; (grouped[uid] ||= []).push(o); });
        const chatMap = {}; (threadsRes.threads || []).forEach(thread => { const uid = thread.customer?._id || thread.customer; chatMap[uid] = (thread.messages || []).map(m => ({ from: m.from, text: m.body, at: m.createdAt })); });
        usersSet(members); store.set(K_ORDERS, grouped); adminChatsSet(chatMap); renderAdmin();
      } catch (error) { toast(error.message); }
    }
    function adminOverview(all, members, revenue) {
      const pending = all.filter(o => o.status === 'paid' || o.status === 'preparing').length;
      return `<h2 class="admin-title">오늘의 운영 현황</h2>
    <div class="metrics"><div class="metric"><span>총 매출</span><b>${money(revenue)}</b><small>누적 결제 완료 기준</small></div><div class="metric"><span>주문</span><b>${all.length}건</b><small>전체 주문</small></div><div class="metric"><span>배송 처리</span><b>${pending}건</b><small>준비가 필요한 주문</small></div><div class="metric"><span>회원</span><b>${members.length}명</b><small>가입 완료 고객</small></div></div>
    <div class="admin-grid"><section class="admin-box"><h3>최근 주문</h3>${adminOrderTable(all.slice(0, 5), false)}</section><section class="admin-box"><h3>운영 안내</h3><p class="admin-empty">주문이 들어오면 고객명, 상품·수량, 배송지와 결제 금액이 여기에 표시됩니다.<br><br>현재 버전은 브라우저 저장소 기반 데모입니다. 실제 고객 주문과 문의를 통합 관리하려면 주문·회원·채팅 데이터를 서버 DB로 이전해야 합니다.</p></section></div>`;
    }
    function adminOrderTable(list, full) {
      if (!list.length) return `<p class="admin-empty">아직 주문 데이터가 없습니다.</p>`;
      return `<table class="admin-table"><thead><tr><th>주문</th><th>상품 / 수량</th>${full ? '<th>배송지</th>' : ''}<th>상태</th><th>결제</th></tr></thead><tbody>${list.map(o => {
        const first = o.items?.[0], p = first && findP(first.id), count = (o.items || []).reduce((n, x) => n + x.qty, 0), who = o.user?.name || '비회원';
        const statusKey = o.id || `${o.userId}|${o.no}`;
        return `<tr><td><b>${o.no}</b><span class="sub">${who} · ${adminDate(o.at)}</span></td><td>${adminName(p)}${(o.items || []).length > 1 ? ` 외 ${o.items.length - 1}` : ''}<span class="sub">총 ${count}개</span></td>${full ? `<td>${esc(o.to?.recipient || '')}<span class="sub">${esc(addrLine(o.to || {})) || '주소 미입력'}</span></td>` : ''}<td><button class="state" data-order-status="${statusKey}" title="클릭해 다음 상태로 변경">${adminStatus(o.status)}</button></td><td><b>${money(o.total || 0)}</b></td></tr>`;
      }).join('')}</tbody></table>`;
    }
    function adminOrdersPanel(all) { return `<h2 class="admin-title">주문 및 배송 관리</h2><p class="admin-note">배송 상태를 누르면 결제 완료 → 상품 준비 → 배송 중 → 배송 완료 순서로 변경됩니다.</p>${adminOrderTable(all, true)}`; }
    function adminMembersPanel(members, all) {
      return `<h2 class="admin-title">회원 관리</h2>${members.length ? `<table class="admin-table"><thead><tr><th>회원</th><th>연락처</th><th>가입일</th><th>주문</th></tr></thead><tbody>${members.map(u => `<tr><td><b>${esc(u.name)}</b><span class="sub">${esc(u.email)}</span></td><td>${esc(u.phone)}</td><td>${adminDate(u.at)}</td><td>${all.filter(o => o.userId === u.id).length}건</td></tr>`).join('')}</tbody></table>` : '<p class="admin-empty">아직 가입한 회원이 없습니다.</p>'}`;
    }
    function adminRevenuePanel(all, revenue) {
      const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(); d.setMonth(d.getMonth() - (5 - i)); return d; });
      const values = months.map(d => all.filter(o => { const x = new Date(o.at); return x.getFullYear() === d.getFullYear() && x.getMonth() === d.getMonth(); }).reduce((n, o) => n + (o.total || 0), 0));
      const max = Math.max(...values, 1);
      return `<h2 class="admin-title">매출 관리</h2><div class="metrics"><div class="metric"><span>누적 매출</span><b>${money(revenue)}</b><small>전체 주문 결제 금액</small></div><div class="metric"><span>객단가</span><b>${all.length ? money(Math.round(revenue / all.length)) : '—'}</b><small>주문 1건당 평균</small></div></div><section class="admin-box"><h3>최근 6개월 매출</h3><div class="revenue-bars">${months.map((d, i) => `<div class="revenue-bar" style="height:${Math.max(4, values[i] / max * 100)}%"><span>${d.getMonth() + 1}월</span></div>`).join('')}</div></section>`;
    }
    function adminChatPanel(members) {
      if (!members.length) return `<h2 class="admin-title">고객 문의</h2><p class="admin-empty">회원이 생기면 이곳에서 고객별 문의 내역을 확인하고 답변할 수 있습니다.</p>`;
      if (!adminChatUser || !members.some(u => u.id === adminChatUser)) adminChatUser = members[0].id;
      const chats = adminChats(), selected = members.find(u => u.id === adminChatUser), messages = chats[adminChatUser] || [];
      return `<h2 class="admin-title">고객 문의</h2><div class="chat"><aside class="chat-list">${members.map(u => `<button class="chat-user" data-chat-user="${u.id}" aria-current="${u.id === adminChatUser}">${esc(u.name)}<small>${esc(u.email)}</small></button>`).join('')}</aside><div class="chat-pane"><div class="chat-log">${messages.length ? messages.map(m => `<div class="bubble ${m.from === 'admin' ? 'me' : ''}">${esc(m.text)}</div>`).join('') : '<p class="admin-empty">아직 대화가 없습니다. 먼저 답변을 남겨보세요.</p>'}</div><form class="chat-compose" id="adminChatForm"><input id="adminChatInput" aria-label="답변 입력" placeholder="${esc(selected.name)}님에게 답변하기"><button>전송</button></form></div></div>`;
    }
    function nextStatus(status) { return ({ paid: 'preparing', preparing: 'shipped', shipped: 'delivered', delivered: 'paid' })[status] || 'preparing'; }
    function updateAdminOrderStatus(key) {
      if (apiUser && !key.includes('|')) {
        const current = apiOrders.find(o => String(o.id) === String(key)), status = nextStatus(current?.status);
        if (!current || !status) return;
        apiRequest(`/api/orders/${key}/status`, { method: 'PATCH', body: JSON.stringify({ status }) }).then(loadAdminFromApi).catch(error => toast(error.message));
        return;
      }
      const [userId, no] = key.split('|'), all = store.get(K_ORDERS, {}), order = (all[userId] || []).find(o => o.no === no);
      if (order) { order.status = nextStatus(order.status); store.set(K_ORDERS, all); renderAdmin(); }
    }
    document.getElementById('adminRoot').addEventListener('click', e => {
      const sec = e.target.closest('[data-admin-sec]'), user = e.target.closest('[data-chat-user]'), state = e.target.closest('[data-order-status]');
      if (e.target.closest('[data-admin-login]')) { openAuth('login'); return; }
      if (e.target.closest('[data-admin-home]')) { go('#/'); return; }
      if (sec) { adminSection = sec.dataset.adminSec; renderAdmin(); }
      if (user) { adminChatUser = user.dataset.chatUser; renderAdmin(); }
      if (state) updateAdminOrderStatus(state.dataset.orderStatus);
    });
    document.getElementById('adminRoot').addEventListener('submit', e => {
      if (e.target.id !== 'adminChatForm') return; e.preventDefault();
      const input = document.getElementById('adminChatInput'), text = input.value.trim(); if (!text) return;
      if (apiUser) { apiRequest(`/api/chat/threads/${adminChatUser}/messages`, { method: 'POST', body: JSON.stringify({ body: text }) }).then(loadAdminFromApi).catch(error => toast(error.message)); return; }
      const chats = adminChats(); chats[adminChatUser] = [...(chats[adminChatUser] || []), { from: 'admin', text, at: Date.now() }]; adminChatsSet(chats); renderAdmin();
    });

    /* ---------------------------- 라우팅 ---------------------------- */
    function syncHeader() {
      document.getElementById('btnAccount').textContent = currentUser() ? t('account') : t('login');
    }
    function go(hash) { location.hash === hash ? route() : location.hash = hash; }
    function route() {
      const h = location.hash || '#/';
      const isAcct = h.startsWith('#/account');
      const isAdmin = h.startsWith('#/admin');
      if (isAdmin && !apiUser && !localStorage.getItem(K_API_TOKEN)) { location.hash = '#/'; return; }
      if (isAdmin && apiUser && apiUser.role !== 'admin') { location.hash = '#/'; return; }
      document.body.classList.toggle('acct-view', isAcct);
      document.body.classList.toggle('admin-view', isAdmin);
      document.getElementById('viewShop').hidden = isAcct || isAdmin;
      document.getElementById('viewAccount').hidden = !isAcct;
      document.getElementById('viewAdmin').hidden = !isAdmin;
      if (isAcct) renderAccount(h.split('/')[2] || 'profile');
      if (isAdmin) {
        if (apiUser?.role === 'admin') loadAdminFromApi();
        else renderAdmin();
      }
      window.scrollTo({ top: 0 });
      syncHeader();
    }
    window.addEventListener('hashchange', route);

    document.getElementById('btnHome').addEventListener('click', () => go('#/'));
    document.querySelector('footer')?.addEventListener('click', e => {
      const link = e.target.closest('a[href="#company"]');
      if (!link) return;
      e.preventDefault();
      document.getElementById('company')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    document.getElementById('btnAccount').addEventListener('click', () => {
      currentUser() ? go('#/account/profile') : openAuth('login');
    });

    /* ---------------------------- 초기화 ---------------------------- */
    applyStatic();
    renderCats();
    renderSort();
    renderGrid();
    renderCatTiles(); renderHeroArt();
    renderCart();
    route();
    hydrateApiSession();
  </script>
</body>

</html>
